<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:'Noto Sans Thai',sans-serif;
        }
    </style>

</head>

<body class="bg-slate-100">

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-blue-900 text-white hidden lg:flex flex-col">

        <div class="text-2xl font-bold p-6 border-b border-blue-800">
            🎓 Student
        </div>

        <nav class="flex-1 mt-4">

            <a href="#" class="block px-6 py-3 hover:bg-blue-800">
                Dashboard
            </a>

            <a href="#" class="block px-6 py-3 bg-blue-800">
                นักศึกษา
            </a>

            <a href="#" class="block px-6 py-3 hover:bg-blue-800">
                คณะ
            </a>

            <a href="#" class="block px-6 py-3 hover:bg-blue-800">
                รายงาน
            </a>

            <a href="#" class="block px-6 py-3 hover:bg-blue-800">
                ตั้งค่า
            </a>

        </nav>

    </aside>

    <!-- Content -->

    <main class="flex-1 p-8">

        <h1 class="text-3xl font-bold mb-8">
            ระบบจัดการIT
        </h1>

        <!-- Cards -->

        <div class="grid md:grid-cols-2 xl:grid-cols-4 gap-6 mb-8">

            <div class="bg-white rounded-xl shadow p-5">
                <p class="text-gray-500">
                    นักศึกษาทั้งหมด
                </p>

                <h2 class="text-4xl font-bold mt-2 text-blue-700">
                    125
                </h2>
            </div>

            <div class="bg-white rounded-xl shadow p-5">
                <p class="text-gray-500">
                    คณะ
                </p>

                <h2 class="text-4xl font-bold mt-2 text-green-600">
                    6
                </h2>
            </div>

            <div class="bg-white rounded-xl shadow p-5">
                <p class="text-gray-500">
                    ชั้นปี
                </p>

                <h2 class="text-4xl font-bold mt-2 text-orange-500">
                    4
                </h2>
            </div>

            <div class="bg-white rounded-xl shadow p-5">
                <p class="text-gray-500">
                    กำลังศึกษา
                </p>

                <h2 class="text-4xl font-bold mt-2 text-purple-600">
                    120
                </h2>
            </div>

        </div>

        <!-- Form -->

        <div class="bg-white rounded-xl shadow p-6 mb-8">

            <h2 class="text-xl font-semibold mb-5">
                เพิ่มข้อมูลนักศึกษา
            </h2>

            <div class="grid md:grid-cols-2 xl:grid-cols-5 gap-4">

                <input
                    class="border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                    placeholder="รหัสนักศึกษา">

                <input
                    class="border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                    placeholder="ชื่อ-สกุล">

                <select class="border rounded-lg px-4 py-3">

                    <option>วิทยาศาสตร์</option>
                    <option>ครุศาสตร์</option>
                    <option>เทคโนโลยี</option>

                </select>

                <input
                    class="border rounded-lg px-4 py-3"
                    placeholder="ชั้นปี">

                <button
                    class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-5">
                    บันทึก
                </button>

            </div>

        </div>

        <!-- Table -->

        <div class="bg-white rounded-xl shadow">

            <div class="p-6 flex justify-between">

                <h2 class="font-semibold text-lg">
                    รายชื่อนักศึกษา
                </h2>

                <input
                    class="border rounded-lg px-4 py-2"
                    placeholder="ค้นหา">

            </div>

            <div class="overflow-auto">

                <table class="w-full">

                    <thead class="bg-slate-50">

                    <tr>

                        <th class="p-4 text-left">
                            รหัส
                        </th>

                        <th class="p-4 text-left">
                            ชื่อ
                        </th>

                        <th class="p-4 text-left">
                            คณะ
                        </th>

                        <th class="p-4 text-left">
                            ชั้นปี
                        </th>

                        <th class="p-4 text-center">
                            จัดการ
                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr class="border-t hover:bg-slate-50">

                        <td class="p-4">
                            65010001
                        </td>

                        <td class="p-4">
                            สมชาย ใจดี
                        </td>

                        <td class="p-4">
                            วิทยาศาสตร์
                        </td>

                        <td class="p-4">
                            3
                        </td>

                        <td class="p-4 text-center space-x-2">

                            <button class="bg-amber-500 text-white px-3 py-1 rounded">
                                แก้ไข
                            </button>

                            <button class="bg-red-600 text-white px-3 py-1 rounded">
                                ลบ
                            </button>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

</body>
</html>
